# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
topics:
  characters: {en: Allowed characters, fr: Caractères permis}
  abbreviations: {en: Abbreviations, fr: Abréviations}
  case-styles: {en: Case styles, fr: Styles de casse}
  word-form: {en: Word form, fr: Forme des mots}
  packages: {en: Packages and coordinates, fr: Paquetages et coordonnées}
  events: {en: Event types, fr: Types d'événements}
  stability: {en: Stability, fr: Stabilité}
rows:
  - id: NAM-004
    topic: characters
    requirement: {en: "Names use only ASCII letters, digits and the separator of their case style.", fr: "Les noms emploient seulement des lettres ASCII, des chiffres et le séparateur de leur style de casse."}
    international: {en: "Unreserved characters are ASCII letters, digits, hyphen, period, underscore and tilde. They never need percent-encoding.", fr: "Les caractères non réservés sont les lettres ASCII, les chiffres, le trait d'union, le point, le trait de soulignement et le tilde. Ils n'ont jamais besoin d'être codés."}
    international_source: {title: "RFC 3986, Uniform Resource Identifier (URI): Generic Syntax (STD 66)", version: "STD 66", date: "2005-01", url: "https://www.rfc-editor.org/rfc/rfc3986.html", archive: "https://web.archive.org/web/20261026154303/https://www.rfc-editor.org/rfc/rfc3986.html"}
    fpsot: {en: "ASCII letters and digits, a letter first, and only the separator of the case style.", fr: "Lettres ASCII et chiffres, une lettre en premier, et seulement le séparateur du style de casse."}
  - id: NAM-005
    topic: abbreviations
    requirement: {en: "Names do not shorten words.", fr: "Les noms n'abrègent pas les mots."}
    international: {en: "Well-known short forms, such as config, id, info and spec, are preferred to the full words in field names.", fr: "Les formes courtes connues, comme config, id, info et spec, sont préférées aux mots complets dans les noms de champs."}
    international_source: {title: "AIP-140, Field names (Google API Improvement Proposals)", date: "2025-10-23", url: "https://google.aip.dev/140", archive: "https://web.archive.org/web/20260928002751/https://google.aip.dev/140"}
    fpsot: {en: "Full words. Only abbreviations from the term base, and id.", fr: "Mots complets. Seulement les abréviations de la base terminologique, et id."}
  - id: NAM-010
    topic: case-styles
    requirement: {en: "Each context uses one case style.", fr: "Chaque contexte emploie un seul style de casse."}
    international: {en: "JSON fields and query parameters use camel case. Path segments use kebab case by preference, or camel case.", fr: "Les champs JSON et les paramètres de requête emploient la casse chameau. Les segments de chemin emploient de préférence le kebab-case, ou la casse chameau."}
    international_source: {title: "Microsoft Azure REST API Guidelines", version: "commit 15c1266", date: "2026-10-22", url: "https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md", archive: "https://github.com/microsoft/api-guidelines/blob/15c12663c363250bea4d60aa054e81466a1f0106/azure/Guidelines.md"}
    fpsot: {en: "lowerCamelCase for fields, query parameters and path variables. kebab-case for path segments and code values.", fr: "lowerCamelCase pour les champs, les paramètres de requête et les variables de chemin. kebab-case pour les segments de chemin et les valeurs codées."}
  - id: NAM-013
    topic: word-form
    requirement: {en: "A name for a collection is plural, and a name for one item is singular.", fr: "Le nom d'une collection est au pluriel, et le nom d'un seul élément est au singulier."}
    international: {en: "Collection segments of a resource name are plural nouns in camel case. Words without a plural keep the singular.", fr: "Les segments de collection d'un nom de ressource sont des noms au pluriel en casse chameau. Les mots sans pluriel gardent le singulier."}
    international_source: {title: "AIP-122, Resource names (Google API Improvement Proposals)", date: "2025-03-10", url: "https://google.aip.dev/122", archive: "https://web.archive.org/web/20260928002751/https://google.aip.dev/122"}
    fpsot: {en: "Plural nouns for lists and collections, in the case style of their context.", fr: "Noms au pluriel pour les listes et les collections, dans le style de casse de leur contexte."}
  - id: NAM-014
    topic: word-form
    requirement: {en: "Field names and path segments are nouns, not verbs.", fr: "Les noms de champs et les segments de chemin sont des noms, pas des verbes."}
    international: {en: "Field names must be nouns that state a value. Only methods carry verb names.", fr: "Les noms de champs doivent être des noms qui énoncent une valeur. Seules les méthodes portent des noms de verbes."}
    international_source: {title: "AIP-140, Field names (Google API Improvement Proposals)", date: "2025-10-23", url: "https://google.aip.dev/140", archive: "https://web.archive.org/web/20260928002751/https://google.aip.dev/140"}
    fpsot: {en: "Nouns or noun phrases for fields and path segments. The HTTP method names the action.", fr: "Noms ou groupes nominaux pour les champs et les segments de chemin. La méthode HTTP nomme l'action."}
  - id: NAM-021
    topic: packages
    requirement: {en: "Java and Kotlin packages start with org.fpsot.", fr: "Les paquetages Java et Kotlin commencent par org.fpsot."}
    international: {en: "A unique package name starts with the reversed Internet domain of its owner. Invalid characters, such as a hyphen, become underscores.", fr: "Un nom de paquetage unique commence par le domaine Internet inversé de son propriétaire. Les caractères non valides, comme le trait d'union, deviennent des traits de soulignement."}
    international_source: {title: "The Java Language Specification, Java SE 25 Edition, section 6.1", version: "Java SE 25", date: "2026-09-15", url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-6.html", archive: "https://web.archive.org/web/20261019214932/https://docs.oracle.com/javase/specs/jls/se25/html/jls-6.html"}
    fpsot: {en: "org.fpsot, then the repository topic with its words joined. Lower case, no underscores.", fr: "org.fpsot, puis le sujet du dépôt avec ses mots joints. Minuscules, sans trait de soulignement."}
  - id: NAM-023
    topic: packages
    requirement: {en: "Maven coordinates start with org.fpsot and fpsot-.", fr: "Les coordonnées Maven commencent par org.fpsot et fpsot-."}
    international: {en: "The groupId follows the Java package rules. The artifactId uses only lower-case letters, digits and hyphens.", fr: "Le groupId suit les règles des paquetages Java. L'artifactId emploie seulement des minuscules, des chiffres et des traits d'union."}
    international_source: {title: "Naming conventions of Maven coordinates", date: "2026-11-03", url: "https://maven.apache.org/guides/mini/guide-naming-conventions.html", archive: "https://web.archive.org/web/20261011200628/https://maven.apache.org/guides/mini/guide-naming-conventions.html"}
    fpsot: {en: "groupId org.fpsot.<topic>. artifactId in kebab-case, starting with fpsot-.", fr: "groupId org.fpsot.<topic>. artifactId en kebab-case, qui commence par fpsot-."}
  - id: NAM-050
    topic: events
    requirement: {en: "Event types start with the reversed domain of the organization that defines them.", fr: "Les types d'événements commencent par le domaine inversé de l'organisation qui les définit."}
    international: {en: "The type attribute is a non-empty string. It should start with a reversed domain name that shows who defines its meaning.", fr: "L'attribut type est une chaîne non vide. Il devrait commencer par un nom de domaine inversé qui montre qui en définit le sens."}
    international_source: {title: "CloudEvents specification", version: "1.0.2", date: "2022-02-06", url: "https://github.com/cloudevents/spec/blob/ce@v1.0.2/cloudevents/spec.md", archive: "https://github.com/cloudevents/spec/blob/fc1f6f31f5f011a72183f1bcea20c987cb683ade/cloudevents/spec.md"}
    fpsot: {en: "org.fpsot.<domain>.<resource>.<event>, kebab-case segments, event as a past-tense verb.", fr: "org.fpsot.<domain>.<resource>.<event>, segments en kebab-case, événement en participe passé."}
  - id: NAM-083
    topic: stability
    requirement: {en: "A published address keeps working, or redirects permanently.", fr: "Une adresse publiée continue de fonctionner, ou redirige de façon permanente."}
    international: {en: "A good address never changes. Leave out author, status, file extension and software from it.", fr: "Une bonne adresse ne change jamais. Elle ne contient ni auteur, ni état, ni extension de fichier, ni logiciel."}
    international_source: {title: "Cool URIs don't change, W3C Style Guide", date: "1998", url: "https://www.w3.org/Provider/Style/URI", archive: "https://web.archive.org/web/20261022095419/https://www.w3.org/Provider/Style/URI"}
    fpsot: {en: "Published page and document addresses keep working. A moved resource redirects permanently.", fr: "Les adresses publiées des pages et des documents continuent de fonctionner. Une ressource déplacée redirige de façon permanente."}
