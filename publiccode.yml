developmentStatus: concept
softwareType: "standalone/other"
description:
  en:
    shortDescription: How FPSOT projects name the identifiers that machines read.
    longDescription: >
      The FPSOT naming specification sets how FPSOT projects name
      repositories, Java and Kotlin packages, Maven coordinates, address
      paths, JSON fields, query parameters, event types, code lists and
      files. Names are in English and use the words of the FPSOT term base,
      and people see translated labels.
    features:
      - Case style for each context
      - Stable names within a major version
  fr:
    shortDescription: Comment les projets de FPSOT nomment les identifiants que les machines lisent.
    longDescription: >
      La spécification de nommage de FPSOT fixe comment les projets de FPSOT
      nomment les dépôts, les paquetages Java et Kotlin, les coordonnées
      Maven, les chemins d'adresse, les champs JSON, les paramètres de
      requête, les types d'événements, les listes de codes et les fichiers.
      Les noms sont en anglais et emploient les mots de la base
      terminologique de FPSOT, et les personnes voient des libellés traduits.
    features:
      - Style de casse pour chaque contexte
      - Noms stables au cours d'une version majeure
